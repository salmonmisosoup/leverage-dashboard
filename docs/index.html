<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}html,body{margin:0}</style>
</head>
<body>
<title>雙市場加碼儀表板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="dash-mode" content="full">
<meta name="dash-trigger" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a night trading desk — one verdict card up top, the ladder of rules beside it, charts and secondary gauges below. One typeface throughout. */
:root{
  --bg:#0a0b0d; --panel:#111317; --panel2:#16191e; --line:#24282f; --line2:#2f343c;
  --fg:#ebe7df; --muted:#8d929b; --faint:#5d626b;
  --brass:#c8a66a; --brass-dim:#7d6942;
  --ok:#5bb78a; --warn:#e2a846; --bad:#e6625a; --info:#6fa8e6;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-weight:700;font-size:1.12rem;letter-spacing:.02em}
.eyebrow{font-size:.74rem;letter-spacing:.12em;color:var(--brass);font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px}
.brand h1{font-weight:700;font-size:1.7rem;letter-spacing:.03em}
.brand p{margin:2px 0 0;font-size:.85rem}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;color:var(--muted);font-weight:500;font-size:.88rem}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.btn{border:1px solid var(--brass-dim);background:transparent;color:var(--brass);padding:7px 14px;border-radius:8px;font-size:.88rem}
.btn:hover{background:rgba(200,166,106,.08)}
.btn[disabled]{opacity:.5;cursor:default}
.stamp{font-size:.78rem;color:var(--muted);text-align:right}

#main{display:flex;flex-direction:column;gap:22px}
#main>.note{margin-top:-12px}
.grid-top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.grid-top{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.verdict{position:relative;overflow:hidden}
.verdict::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--state)}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px 4px 10px;font-size:.82rem;font-weight:700;color:var(--state);background:color-mix(in srgb,var(--state) 14%,transparent);border:1px solid color-mix(in srgb,var(--state) 40%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--state);box-shadow:0 0 0 4px color-mix(in srgb,var(--state) 22%,transparent)}
.stale{border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.88rem}
.srcline{margin:10px 0 0;font-size:.8rem;color:var(--muted);line-height:1.55}
.vtitle{font-size:clamp(1.5rem,3.2vw,2.15rem);font-weight:700;line-height:1.3;margin:12px 0 6px}
.vsub{color:var(--muted);margin:0 0 16px}
.why{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font-size:.8rem;border:1px solid var(--line2);border-radius:6px;padding:3px 9px;background:var(--panel2)}
.chip.on{border-color:color-mix(in srgb,var(--state) 55%,transparent);color:var(--fg)}
.alloc{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;gap:6px 12px;align-items:center;font-size:.86rem}
.bar{height:12px;border-radius:3px;background:var(--panel2);display:flex;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .lev{background:var(--brass)} .bar .bul{background:#3b4a5c}
.legend{display:flex;gap:16px;font-size:.78rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}

.calc{margin-top:18px;border-top:1px dashed var(--line2);padding-top:16px}
.calc-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
label.f input{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;color:var(--fg);font-family:var(--font);font-variant-numeric:tabular-nums;font-size:.95rem;width:100%;box-sizing:border-box}
.action{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:.92rem}
.action b{color:var(--brass);font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--faint);margin-top:8px}

.ladder{display:flex;flex-direction:column}
.rung{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.rung:last-child{border-bottom:0}
.alloc [hidden]{display:none!important}
@media (max-width:560px){.rung{grid-template-columns:22px minmax(0,1fr)}.rung .w{grid-column:2;text-align:left!important;font-size:.95rem!important;margin-top:2px}}
.vbox{padding:2px 0 12px 34px;border-bottom:1px solid var(--line)}
.vmeter{position:relative;height:6px;border-radius:3px;background:var(--line);margin:22px 0 12px}
.vmeter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c);opacity:.85}
.vmeter .tk{position:absolute;top:-4px;width:2px;height:14px;background:var(--line2)}
.vmeter .tk.on{background:var(--c)}
.vmeter .now{position:absolute;bottom:10px;transform:translateX(-50%);font-size:.72rem;color:var(--muted);white-space:nowrap}
.vtiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.vtiers .vt{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:.86rem}
.vtiers .vt b{font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.vtiers .vt span{white-space:nowrap}
@media (max-width:560px){.vbox{padding-left:0}}
.vtiers .vt.on{border-color:var(--c)}
.vtiers .vt.on b,.vtiers .vt.on span{color:var(--c)}
.cred{margin-top:8px;font-size:.8rem;color:var(--muted)}
.cred.on{color:var(--warn,#e2a846);font-weight:500}
.next{margin-top:14px;display:grid;gap:6px}
.next .nr{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.next .nr b{font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.next .nr.on{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.next .nr.on b{color:var(--c)}
.ctabs{display:flex;gap:6px;margin-bottom:12px}
.ctabs button{border:1px solid var(--line2);background:none;color:var(--muted);padding:5px 12px;border-radius:999px;font-size:.84rem}
.ctabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sigtbl td:first-child,.sigtbl th:first-child{white-space:nowrap}
.rung .mk{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);margin-top:5px}
.rung.on .mk{background:var(--c);border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.rung .t{font-weight:500}
.rung .d{font-size:.8rem;color:var(--muted)}
.rung .w{white-space:nowrap;font-size:1.05rem;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.rung.on .w{color:var(--c)}
.grp{font-size:.74rem;letter-spacing:.06em;color:var(--faint);padding-top:8px}
.done{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:.76rem;font-weight:400;color:var(--muted);cursor:pointer;vertical-align:1px}
.done input{accent-color:var(--brass);width:14px;height:14px;margin:0}
.grp.major{font-size:.95rem;font-weight:700;color:var(--fg);letter-spacing:.04em;padding-top:16px;margin-top:4px;border-top:1px solid var(--line2)}
.grp.major:first-child{border-top:0;padding-top:4px;margin-top:0}
.grp.major+.rung{border-top:0}
.rung:has(+ .grp){border-bottom:0}
.rung:has(+ .vbox){border-bottom:0}

.refs{margin-top:10px}
.pf-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.pf-grid{grid-template-columns:1fr}}
.pf-tbl{width:100%;max-width:720px;border-collapse:collapse;font-size:.88rem}
.pf-tbl th:nth-child(5),.pf-tbl td:nth-child(5){text-align:left;padding-left:14px}
.pf-tbl th:nth-child(6),.pf-tbl td:nth-child(6){width:28px}
.pf-tbl th,.pf-tbl td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.pf-tbl td.tx{line-height:34px}
.pf-tbl input,.pf-tbl select{height:34px;box-sizing:border-box}
.pf-tbl .sub{font-size:.72rem;color:var(--muted);margin-top:3px;white-space:normal;max-width:150px;line-height:1.3}
.pf-tbl th:first-child,.pf-tbl td:first-child{text-align:left}
.pf-tbl td.role{color:var(--muted);text-align:left;font-size:.8rem}
.pf-tbl input{width:84px;padding:5px 7px;font-size:.88rem;text-align:right}
.pf-tbl tr.grp td{color:var(--brass);font-weight:500;border-bottom:1px solid var(--line2);padding-top:14px;text-align:left}
.pf-bar{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0;font-size:.86rem}
.pf-bar .bar{height:10px}
.pf-acts{display:grid;gap:10px;margin-top:6px}
.pf-act{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:12px 14px;background:var(--panel2);font-size:.9rem}
.pf-act h4{margin:0 0 6px;font-size:.92rem;color:var(--c)}
.pf-act ul{margin:4px 0 0;padding-left:18px}
.pf-act li{margin:3px 0}
.pf-act b{color:var(--fg);font-variant-numeric:tabular-nums}
.pf-set{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 4px}
.pf-set label{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.pf-set input,.pf-set select{width:150px}
.pf-tbl select{font-size:.8rem;padding:4px 6px;width:auto;min-width:118px}
.btn-ghost{border:1px solid var(--line2);background:none;color:var(--fg);padding:6px 12px;border-radius:8px;font-size:.84rem;cursor:pointer}
.btn-x{border:0;background:none;color:var(--faint);font-size:1.1rem;cursor:pointer}
.pf-io{margin-top:8px}
.pf-slot{margin-top:18px;border-top:1px dashed var(--line2);padding-top:14px}
.pf-slot h2{font-size:1rem;margin:0 0 6px}
.refs summary{cursor:pointer;color:var(--muted);font-size:.86rem;padding:8px 2px}
.refs .stats{margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats>.stat:last-child:nth-child(odd){grid-column:1/-1}}
.stat{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:.76rem;color:var(--muted)}
.stat .v{font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat .s{font-size:.74rem;color:var(--faint)}
.tag{font-size:.66rem;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;border:1px solid var(--line2);color:var(--faint)}
.tag.main{color:var(--brass);border-color:var(--brass-dim)}

.charts{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.chart-card h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.chart-card h2 small{font-size:.78rem;color:var(--muted);font-weight:400}
.chart{width:100%;height:340px;margin-top:8px}
.chart.sm{height:220px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}

details{border-top:1px solid var(--line);padding-top:4px}
summary{cursor:pointer;padding:10px 0;font-weight:700}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;font-size:.88rem}
.rules h3{font-size:.92rem;margin-bottom:6px;color:var(--brass);font-weight:500}
.rules ul{margin:0;padding-left:1.1em;color:var(--muted)}
.rules li{margin:3px 0}
table.bt{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
table.bt th,table.bt td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.bt th:first-child,table.bt td:first-child{text-align:left}
table.bt th{color:var(--muted);font-weight:500}
table.bt.eu td,table.bt.eu th{text-align:left;white-space:normal}
.eu-notes{margin:12px 0 0;padding-left:1.1em;color:var(--muted);font-size:.84rem}
.eu-notes li{margin:4px 0}
table.bt caption{caption-side:top;text-align:left;font-size:.82rem;color:var(--muted);padding-bottom:6px}
.tbl{overflow-x:auto}
footer{font-size:.76rem;color:var(--faint);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px}
.src{display:flex;flex-wrap:wrap;gap:6px 14px}
.src span::before{content:"●";margin-right:5px;color:var(--ok)}
.src span.bad::before{color:var(--bad)}
.guide{position:fixed;inset:0;z-index:30;background:rgba(5,6,8,.72);overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.guide-in{max-width:780px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px 22px 26px;display:flex;flex-direction:column;gap:6px}
.guide-top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:-22px;background:var(--panel);padding:6px 0 10px;border-bottom:1px solid var(--line);z-index:1}
.gsec{padding-top:14px}
.gsec h3{font-size:1rem;font-weight:700;margin-bottom:6px;color:var(--brass)}
.gsec ul{margin:0;padding-left:1.15em;color:var(--fg);font-size:.9rem}
.gsec li{margin:5px 0;line-height:1.65}
.gintro{margin:0 0 8px;font-size:.88rem;color:var(--muted);line-height:1.65}
table.bt.gt td,table.bt.gt th{text-align:left;white-space:normal;vertical-align:top}
table.bt.gt td:first-child{white-space:nowrap;color:var(--muted)}
.gsec .rules h3{font-size:.9rem;color:var(--fg)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.bar .one{background:#8fb3a0}
.bang{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-weight:700;font-size:.8rem;margin-right:6px;line-height:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(230,98,90,.25)}}
.rung .t{display:flex;align-items:center}
.rung .d b{color:var(--fg)}
.bt-ctl{display:flex;flex-direction:column;gap:10px}
.rngs{display:flex;flex-wrap:wrap;gap:6px}
.rngs button{border:1px solid var(--line2);background:none;color:var(--muted);padding:4px 10px;border-radius:999px;font-size:.8rem}
.rngs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bt-ctl .seg{align-self:flex-start}
.bt-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);margin:8px 0 2px}
.bt-legend span{display:inline-flex;align-items:center;gap:6px}
.bt-sw{display:inline-block;width:10px;height:10px;background:var(--c)}
.bt-sw.tri{width:0;height:0;background:none;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--c)}
.bt-sw.tri.down{border-bottom:0;border-top:10px solid var(--c)}
.bt-sw.tri.hollow{border-bottom-color:transparent;width:12px;height:10px;border:0;background:none;position:relative}
.bt-sw.tri.hollow::before{content:"△";position:absolute;left:0;top:-5px;color:var(--fg);font-size:12px}
.bt-sw.dia{transform:rotate(45deg);width:9px;height:9px}
.bt-sw.dot{border-radius:50%}
.bt-sw.band{width:14px;opacity:.35}
.bt-chart{position:relative;margin-top:8px;min-height:200px}
.bt-chart svg{display:block;overflow:visible}
.bt-tip{position:absolute;pointer-events:none;background:#0f1115;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:.76rem;line-height:1.5;white-space:nowrap;z-index:2;color:var(--fg)}
.bt-tip .d{color:var(--muted)}
table.bt tr.on td{color:var(--fg);font-weight:700}
table.bt tr:not(.on) td{color:var(--muted)}
table.bt.sigtbl tr td,table.bt.gt tr td,table.bt.eu tr td{color:var(--fg);font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p class="muted" id="subtitle"></p>
    </div>
    <div class="top-r">
      <div class="seg" role="tablist" id="tabs"></div>
      <div class="seg" id="venue" hidden></div>
      <div class="seg" id="lang" hidden></div>
      <button class="btn" id="refresh" hidden></button>
      <button class="btn" id="guideBtn"></button>
      <div class="stamp" id="stamp"></div>
    </div>
  </header>
  <div id="stale" class="stale" role="status" hidden></div>
  <div id="refreshMsg" class="note" hidden></div>
  <main id="main"><div class="loading">…</div></main>
  <div id="guide" class="guide" hidden role="dialog" aria-modal="true" aria-labelledby="guideTitle">
    <div class="guide-in">
      <div class="guide-top"><h2 id="guideTitle"></h2><button class="btn" id="guideClose" aria-label="close">✕</button></div>
      <div id="guideBody"></div>
    </div>
  </div>
  <footer>
    <div class="src" id="sources"></div>
    <div id="foot1"></div>
    <div id="foot2"></div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function(){
const MODE = document.querySelector('meta[name="dash-mode"]').content;
const TRIGGER = document.querySelector('meta[name="dash-trigger"]').content;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {fg:css('--fg'),muted:css('--muted'),faint:css('--faint'),line:css('--line'),line2:css('--line2'),brass:css('--brass'),ok:css('--ok'),warn:css('--warn'),bad:css('--bad'),info:css('--info'),panel:css('--panel')};
const FONT = css('--font');
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let LANG = MODE==='us' ? (store.get('dash-lang') || 'zh') : 'zh';
let VENUE = store.get('dash-venue') || 'us';
const EN = () => LANG==='en';
const L = (zh,en) => EN()?en:zh;

/* ---------- text ---------- */

function lastMg(m){ const e=(m.rule.events||[]).filter(x=>x[1]==='mg'); return e.length?e[e.length-1][0]:null; }
function mgDesc(m){ const g=m.rule.margin;
  if (m.rule.margin.tw_yoy==null) return L(`美國 FINRA 融資餘額年增 ${sgn(g.us_yoy,0)}（> 50% 為過熱）`,`US FINRA margin debt ${sgn(g.us_yoy,0)} year on year (above 50% is overheated)`);
  return `台股融資÷指數 一年 ${sgn(g.tw_ratio,0)}（> 20%）、融資兩年 ${sgn(g.tw_2y,0)}（> 20%），美股融資年增 ${sgn(g.us_yoy,0)}（> 50%）`;
}
function pauseWhy(m){ const r=m.rule;
  if (r.panic_zone) return L('VIX 還在 35 以上','VIX is still at or above 35');
  if (r.deep_zone) return L('還在深跌區（距一年高點跌超過 30%）','the market is still more than 30% below its 1-year high');
  if (r.cool.active) return L(`恐慌加碼後還在 60 個交易日的冷卻期（已過 ${r.cool.days_since_add} 天）`,`it is within 60 trading days of a panic buy (${r.cool.days_since_add} so far)`);
  return '';
}
function verdictText(m, nm){
  const r=m.rule, st=m.state, w=pct(r.panic.target), base=pct(m.base);
  const why = {panic1:L(`VIX ${r.vix} ≥ 35`,`VIX ${r.vix} ≥ 35`), panic2:L(`VIX ${r.vix} ≥ 40`,`VIX ${r.vix} ≥ 40`), deep:L(`距一年高點 ${sgn(r.panic.deep.dd)}，一年內 VIX 曾到 ${r.panic.deep.vix_max252}`,`${sgn(r.panic.deep.dd)} from the 1-year high, and VIX reached ${r.panic.deep.vix_max252} within the year`)}[r.panic.why]||'';
  const left = Math.max(0, r.reoff_days - r.margin.off_days);
  const T = {
    panic:[L(`二倍槓桿加到 ${w}：先賣一倍原型，不夠再用子彈`,`Raise 2x to ${w}: sell 1x first, then use reserve`),
           L(`${why}。把一倍原型換成 ${nm.lev}，不夠再用子彈，直到二倍槓桿佔總資產 ${w}。VIX 還在門檻以上、比重又掉回目標以下時，可以再補。`,`${why}. Swap 1x into ${nm.lev}, then use reserve, until 2x is ${w} of the total. While the signal holds and your share slips below target, top up again.`)],
    reentry:[L(`一倍原型全部換回 ${nm.lev}`,`Move all 1x back into ${nm.lev}`),
           L(`融資訊號已關閉 ${r.margin.off_days} 個交易日（滿 ${r.reoff_days}），收盤在季線上方。`,`The margin signal has been off for ${r.margin.off_days} trading days (${r.reoff_days} needed) and price is above the 60-day MA.`)],
    refill:[L(`${nm.lev} 調回 ${base}，賣出的錢買 ${nm.bul}`,`Trim ${nm.lev} back to ${base}; put the rest in ${nm.bul}`),
           L(`週 RSI ${r.rsi} 超過 ${r.rsi_th}。把超過 ${base} 的二倍槓桿賣掉換成子彈，留給下一次恐慌。`,`Weekly RSI ${r.rsi} is above ${r.rsi_th}. Sell the 2x above ${base} into reserve for the next panic.`)],
    convert:[L(`二倍槓桿全部換成一倍原型（${nm.one}）`,`Switch all 2x into 1x (${nm.one})`),
           L(`${mgDesc(m)}。融資過熱時二倍槓桿全部換成一倍原型，子彈不動；之後 VIX 衝上 35 時，先用一倍原型加碼。`,`${mgDesc(m)}. While margin is overheated, hold 1x instead of 2x and leave the reserve alone; if VIX later jumps above 35, the 1x is used first to buy 2x.`)],
    mgpause:[L(`融資過熱，但${pauseWhy(m)}，二倍槓桿先不換`,`Margin is overheated, but ${pauseWhy(m)}, so keep the 2x for now`),
           L(`${mgDesc(m)}。恐慌期間或剛加碼完不換，避免剛買進就賣出；條件解除後再換成一倍原型。`,`${mgDesc(m)}. The switch waits during a panic or right after a panic buy, so you don't sell what you just bought.`)],
    wait1x:[L(`融資已退燒，一倍原型繼續持有`,`Margin has cooled; keep holding 1x`),
           L(`規則在 ${D8(lastMg(m))} 把二倍槓桿換成一倍原型。融資訊號關閉滿 ${r.reoff_days} 個交易日（約 15 個月）而且收盤在季線上方，才換回二倍槓桿；還差 ${left} 個交易日。新投入的錢照常買二倍槓桿。`,
             `The rules switched 2x into 1x on ${D8(lastMg(m))}. They move back to 2x once the margin signal has been off for ${r.reoff_days} trading days (about 15 months) and price is above the 60-day MA; ${left} trading days to go. New money buys 2x as usual.`)],
    normal:[L('沒有觸發條件，照現在的比例持有','No signal. Hold what you have.'),
           L(`每月薪資照 60／40 買進；收盤在季線下方時全部買二倍槓桿。`,`Buy at 60 / 40 each month; when price is below the 60-day MA, put it all into 2x.`)],
  };
  return T[st]||T.normal;
}

/* 照規則現在應該有的結構：恐慌加碼目標、二倍槓桿 60/40，或一倍原型 60/40 */
function sugMix(m){ const r=m.rule, b=m.base, t_=r.panic.target||0;
  if (t_>0) return [t_,0,1-t_];
  if (m.state==='convert'||m.state==='wait1x') return [0,b,1-b];
  return [b,0,1-b]; }
function sugNote(m){ const r=m.rule;
  const a = m.state==='wait1x' ? L('已經換成的一倍原型繼續持有，等融資退燒滿 15 個月再換回；新投入的錢照常買二倍槓桿。','Keep the 1x you switched into until margin has been cool for 15 months; new money still buys 2x.')
    : m.state==='mgpause' ? L(`融資過熱，但${pauseWhy(m)}；條件解除後換成一倍原型 60%／子彈 40%。`,`Margin is overheated, but ${pauseWhy(m)}; once that clears, switch to 1x 60% / reserve 40%.`) : '';
  return a + L('二倍槓桿漲多後比例會往上漂，規則只在週 RSI 過熱時調回；沒有訊號時，和建議差 15% 以內不用調整。','After gains the 2x share drifts up; the rules only trim it when weekly RSI runs hot. With no signal, a gap of up to 15% from the suggestion needs no action.'); }
async function mineFromPF(key){ try{ const rows=JSON.parse(store.get('pf-rows')||'[]'); if(!rows.some(r=>+r.n>0)) return null; await loadPrices();
  const RL = key==='tw' ? ['tl','t1','tb'] : ['ul','up','ub']; const v=[0,0,0];
  rows.forEach(r=>{ const c=(r.c||'').toUpperCase(); const role=r.r||autoRole(c); const i=RL.indexOf(role); const x=PRICES.p[c]; if(i>=0&&x) v[i]+=(+r.n||0)*x[1]; });
  const T=v[0]+v[1]+v[2]; return T? v.map(x=>x/T) : null; }catch(e){ return null; } }

  grp(L('融資過熱','Margin overheating'), true);

  const md=r.model; rung(r.margin.reentry_ready && md.w1>0.01, C.ok, L('融資退燒換回','Back to 2x after cooling'), L(`融資訊號關閉 ${r.margin.off_days}／${r.reoff_days} 個交易日、收盤${r.below60?'在季線下方 ✗':'在季線上方 ✓'}${md.w1>0.01?'':'（規則目前沒有一倍原型）'}`,`Margin signal off ${r.margin.off_days} / ${r.reoff_days} trading days; price ${r.below60?'below the 60-day MA ✗':'above the 60-day MA ✓'}${md.w1>0.01?'':' (the rules hold no 1x now)'}`), L('一倍原型 → 二倍槓桿','1x → 2x'));
  grp(L('每月薪資','Monthly savings'), true);
  rung(r.below60, C.warn, L('收盤在季線下方','Close below the 60-day MA'), L(`季線 ${fmt(r.ma60,idxD)}${isTW?'（含息指數）':''}，收盤${r.below60?'低':'高'} ${pct(Math.abs(r.close/r.ma60-1),1)}`,`60-day MA ${fmt(r.ma60,idxD)}; price is ${pct(Math.abs(r.close/r.ma60-1),1)} ${r.below60?'below':'above'}`), r.salary.to==='1x'?L('薪資全買一倍原型','All savings to 1x'):L('薪資全買二倍槓桿','All savings to 2x'));
  lad.append(LD);
  if (isTW) lad.append(el('p',{class:'note'},'台股的季線、距高點、週 RSI 用「加權報酬指數（含息）」計算，和回測一致，所以數字和加權指數本身略有不同。'));
  const top = el('div',{class:'grid-top'}); top.append(verdict, lad); main.append(top);
  if (MODE==='us') renderPFUS(main, verdict);

  // ===== stats =====
  const mac = DATA.macro||{};
  const stats = el('section',{class:'stats'});
  const stat=(k,v,s,main_)=>stats.append(el('div',{class:'stat'}, el('div',{class:'k'},k, el('span',{class:'tag'+(main_?' main':'')}, main_?t('tag_main'):t('tag_ref'))), el('div',{class:'v'},v), el('div',{class:'s'},s)));
  stat(t('k_vix'), mac.vix?fmt(mac.vix.last,2):'—', mac.vix?(mac.vix.live?t('s_vix_live',{t:mac.vix.live.slice(5).replace('-','/')}):D8(mac.vix.asof)):'', true);
  stat(t('k_rsi'), r.rsi, t('s_rsi',{th:r.rsi_th}), true);
  stat(isTW?'融資÷指數 年增':t('k_mg'), isTW?sgn(r.margin.tw_ratio,0):sgn(r.margin.us_yoy,0), isTW?`融資本身年增 ${sgn(r.margin.tw_yoy,0)}・兩年 ${sgn(r.margin.tw_2y,0)}・美股 ${sgn(r.margin.us_yoy,0)}`:L('FINRA，> 50% 過熱','FINRA; > 50% is overheated'), true);
  stat(t('k_cr'), pp(r.panic.baa_chg), L('> 0.7 暫停 85%・> 0.5 不深跌補滿','> 0.7 pauses 85% · > 0.5 blocks top-up'), true);
  stat(t('k_y2'), pp(r.panic.y2_chg), L('> 0.5 暫停 85%','> 0.5 pauses 85%'), true);
  stat(t('k_dd'), sgn(m.dd), t('s_dd',{p:fmt(m.ath,idxD), d:D8(m.ath_date)}), false);
  main.append(stats);
  const refs=el('details',{class:'refs'}); refs.append(el('summary',{},t('refs_h')));
  const stats2=el('section',{class:'stats'});
  { const stat2=(k,v,s_)=>stats2.append(el('div',{class:'stat'}, el('div',{class:'k'},k, el('span',{class:'tag'},t('tag_ref'))), el('div',{class:'v'},v), el('div',{class:'s'},s_)));
    stat2(t('k_fg'), mac.fg?fmt(mac.fg.last,0):'—', mac.fg?fgLabel(mac.fg.last)+' · '+D8(mac.fg.asof):'');
    stat2(t('k_vxn'), mac.vxn?fmt(mac.vxn.last,2):'—', t('s_vxn'));
    stat2(t('k_term'), mac.term?mac.term.last.toFixed(3):'—', t('s_term'));
    stat2(t('k_hy'), mac.hy?mac.hy.last.toFixed(2)+'%':'—', mac.hy&&mac.hy.chg63!=null?t('s_hy',{v:(mac.hy.chg63>0?'+':'')+mac.hy.chg63}):'');
    stat2(t('k_fpe'), mac.fpe?String(mac.fpe.last)+'x':'—', mac.fpe?t('s_fpe',{d:D8(mac.fpe.asof)}):''); }
  refs.append(stats2, el('p',{class:'note'}, t('stats_note'))); main.append(refs);

  // ===== charts =====
  const idx = isTW ? L('加權指數','TAIEX') : 'QQQ';
  const ch = el('div',{class:'charts'});
  const c1 = el('section',{class:'card chart-card'}); c1.append(el('h2',{}, t('ch_price',{idx}), el('small',{}, t('ch_price_s'))), el('div',{class:'chart',id:'c-price'}));
  const two = el('div',{class:'two'});
  const c2 = el('section',{class:'card chart-card'}); c2.append(el('h2',{}, t('ch_vix'), el('small',{}, t('ch_vix_s'))), el('div',{class:'chart sm',id:'c-vix'}));
  const c3 = el('section',{class:'card chart-card'}); c3.append(el('h2',{}, t('ch_rsi'), el('small',{}, t('ch_rsi_s',{th:r.rsi_th}))), el('div',{class:'chart sm',id:'c-rsi'}));
  two.append(c2,c3); ch.append(c1,two); main.append(ch);
  // ===== history =====

      const w=el('div',{class:'tbl'}); const tb=el('table',{class:'bt sigtbl'});

      w.append(tb); hs.append(w); main.append(hs); } }

/* ===================== 規則 → 持股建議 =====================
   v: {L2,L1,B} 二倍槓桿／一倍原型／子彈的市值；sal: 本月可投入金額
   o: {nm, buy(role,amt)->html, sell(role,amt)->html} */
function plan(m, v, sal, o){
  const r=m.rule, base=m.base, nm=o.nm; const acts=[]; const A=(c,h,items)=>acts.push({c,h,items});
  const T=v.L2+v.L1+v.B, pT=r.panic.target||0, inst=r.conv_ok?'one':'lev', instN=r.conv_ok?nm.one:nm.lev;
  if (!T){
    if (sal>0){ const E=pT>0?pT:base; const it=[];
      it.push(L(`還沒有持股：第一次投入照${pT>0?'恐慌加碼的目標':'基準'}比例建立組合`,`No holdings yet. Build the ${pT>0?'panic-buy target':'base'} mix with your first money:`));
      it.push(`${o.buy(inst,sal*E)}${L('、',', ')}${o.buy('bul',sal*(1-E))}`);
      if (r.conv_ok) it.push(L(`現在融資過熱，股票部分先買一倍原型 ${nm.one}，不買二倍槓桿。等融資訊號關閉滿 15 個月、收盤在季線上方，再換成 ${nm.lev}；中間如果 VIX ≥ 35，會先用 ${nm.one} 加碼。`,`Margin is overheated now, so the stock part goes into 1x (${nm.one}), not 2x. It moves to ${nm.lev} after the margin signal has been off for 15 months with price above the 60-day MA; if VIX reaches 35 first, the ${nm.one} is used to buy 2x.`));
      if (m.state==='wait1x') it.push(L(`規則目前持有一倍原型，是 ${D8(lastMg(m))} 融資過熱時換的；新投入的錢照規則買二倍槓桿。`,`The rules hold 1x from the ${D8(lastMg(m))} margin switch; new money buys 2x under the rules.`));
      if (r.below60 && !pT) it.push(L('為什麼不是全買：季線下方「薪資全買」的前提是手上已經有 40% 子彈留給恐慌加碼。第一次投入還沒有子彈，所以先照基準建立。','Why not all of it? The below-the-MA rule assumes you already hold a 40% reserve for panic buys. Your first money has to build that reserve.'));
      it.push(L('之後每個月照上面的燈號操作。','From next month on, follow the signal above.'));
      A(C.brass, L('第一次投入','Your first investment'), it); }
    return acts;
  }
  const w2=v.L2/T, w1=v.L1/T, E=w2+w1; let acted=false;
  if (pT>0){
    if (pT>w2+0.03){ let need=(pT-w2)*T; const u1=Math.min(v.L1,need); need-=u1; const ub=Math.min(v.B,need); const it=[];
      if (u1>1) it.push(L('賣出一倍原型：','Sell 1x: ')+o.sell('one',u1));
      if (ub>1) it.push(L('賣出子彈：','Sell reserve: ')+o.sell('bul',ub));
      it.push(L('買進 ','Buy ')+o.buy('lev',u1+ub));
      const nw=(v.L2+u1+ub)/T; it.push(L(`完成後二倍槓桿 ${pct(nw)}`,`After this: 2x at ${pct(nw)}`)+(nw<pT-0.01?L('（子彈已全部用完）',' (reserve fully used)'):''));
      A(C.bad, L(`! 恐慌加碼：二倍槓桿加到 ${pct(pT)}`,`! Panic buy: raise 2x to ${pct(pT)}`), it); acted=true; }
    else A(C.bad, L('恐慌加碼','Panic buy'), [L(`二倍槓桿已經 ${pct(w2)}，達到目標 ${pct(pT)}，不用再動。之後比重掉回目標以下、訊號還在時再補。`,`2x is already ${pct(w2)}, at the ${pct(pT)} target. Top up later if it slips below while the signal holds.`)]);
  } else if (r.margin.reentry_ready && v.L1>1){
    A(C.ok, L('換回二倍槓桿','Back to 2x'), [L('賣出一倍原型：','Sell 1x: ')+o.sell('one',v.L1), L('買進 ','Buy ')+o.buy('lev',v.L1)]); acted=true;
  } else if (r.rsi_hot && w2>base+0.03){ const x=(w2-base)*T;
    A(C.info, L(`過熱調節：二倍槓桿調回 ${pct(base)}`,`Trim: 2x back to ${pct(base)}`), [L('賣出 ','Sell ')+o.sell('lev',x), L('買進 ','Buy ')+o.buy('bul',x), L(`完成後二倍槓桿 ${pct(base)}`,`After this: 2x at ${pct(base)}`)]); acted=true;
  } else if (r.conv_ok && v.L2>1){
    A(C.warn, L('融資過熱：二倍槓桿換成一倍原型','Margin overheating: switch 2x into 1x'), [...(o.dip2x?['你開了「季線下方薪資買二倍槓桿」：如果這些二倍槓桿是融資過熱期間在季線下方用薪資買的，可以不用換；只有之前就持有的二倍槓桿需要換。']:[]), L('賣出 ','Sell ')+o.sell('lev',v.L2), L('買進 ','Buy ')+o.buy('one',v.L2), L('子彈不動。','Leave the reserve as it is.')]); acted=true;
  } else {
    const it=[L(`目前二倍槓桿 ${pct(w2)}、一倍原型 ${pct(w1)}、子彈 ${pct(1-E)}，今天規則沒有要你買賣。`,`You hold 2x ${pct(w2)}, 1x ${pct(w1)}, reserve ${pct(1-E)}. The rules have no trade for you today.`)];
    if (r.rsi_hot) it.push(L(`週 RSI 過熱，但二倍槓桿沒有超過 ${pct(base+0.03)}，不用調節。`,`Weekly RSI is hot, but 2x is not above ${pct(base+0.03)}, so no trim.`));

const QCACHE_MS=6*3600*1000;
async function fetchQuote(code){
  const k='q:'+code; try{ const c=JSON.parse(store.get(k)||'null'); if(c&&Date.now()-c.t<QCACHE_MS) return c; }catch(e){}
  let res=null;
  if(/^[A-Z][A-Z0-9\-]{0,5}$/.test(code)){
    try{ const d=new Date(Date.now()-12*864e5).toISOString().slice(0,10);
      const r=await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=USStockPrice&data_id=${code}&start_date=${d}`); const j=await r.json();
      if(j.data&&j.data.length){ const x=j.data[j.data.length-1]; res={p:+x.Close,cur:'USD',d:x.date}; } }catch(e){}
  }
  if(res){ res.t=Date.now(); store.set(k,JSON.stringify(res)); }
  return res;
}
function fxConv(p, from, to){
  const F=(DATA&&DATA.fx)||{}; const r=c=>c==='EUR'?1:(F['EUR'+c]||{USD:1.1,GBP:0.85}[c]);
  const a=r(from), b=r(to); return (a&&b)? p/a*b : null;
}

  let cfg={tw:70,sal:'',ul:'00830'}; try{ Object.assign(cfg, JSON.parse(store.get('pf-cfg')||'{}')); }catch(e){} if(!cfg.v2){ cfg.ul='00830'; cfg.v2=1; }

  const body=el('tbody',{}); tb.append(body);
  const w=el('div',{class:'tbl'}); w.append(tb); c1.append(w);
  const addB=el('button',{class:'btn-ghost'},'＋ 新增一列'); addB.onclick=()=>{ rows.push({c:'',n:'',r:''}); save(); drawRows(); upd(); };
  c1.append(el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:10px'},addB));
  c1.append(el('p',{class:'note'},'收盤價日期：'+(PRICES.date?D8(PRICES.date):'最近交易日')+'。分類決定這檔怎麼算進規則，常見標的會自動判斷，也可以自己改。'));
  const valCells=[];
  function drawRows(){
    body.textContent=''; valCells.length=0;
    rows.forEach((r,i)=>{
      const tr=el('tr');
      const ci=el('input',{type:'text',value:r.c,placeholder:'例如 00685L',style:'width:86px;text-align:left'});
      const ni=el('input',{type:'number',inputmode:'numeric',min:'0',value:r.n,placeholder:'0'});

      ci.oninput=()=>{ r.c=ci.value.trim(); save(); refresh(); upd(); };
      ni.oninput=()=>{ r.n=ni.value; save(); upd(); };
      sel.onchange=()=>{ r.r=sel.value; save(); upd(); };
      del.onclick=()=>{ rows.splice(i,1); if(!rows.length) rows.push({c:'',n:'',r:''}); save(); drawRows(); upd(); };
      tr.append(el('td',{},ci,nameDiv), el('td',{},ni), pc, vc, el('td',{},sel), el('td',{class:'tx'},del)); body.append(tr); refresh();

  // ---- 現況 + 動作 ----
  const c2=el('section',{class:'card'}); c2.append(el('h2',{},'現況與今天要做的事'));
  const set=el('div',{class:'pf-set'});
  const fTw=el('input',{type:'number',min:'0',max:'100',value:cfg.tw}); const fSal=el('input',{type:'number',min:'0',inputmode:'numeric',placeholder:'例如 60000',value:cfg.sal});
  const fUl=el('select',{}); [['00830','全部 00830（費半 1 倍）'],['mix','00670L、00830 各半'],['00670L','全部 00670L（納指 2 倍）']].forEach(([k,v])=>fUl.append(el('option',{value:k},v))); fUl.value=cfg.ul;
  const fDip=el('input',{type:'checkbox',style:'width:auto;margin:0 6px 0 0;accent-color:var(--brass)'}); fDip.checked=!!cfg.dip2x;
  fTw.oninput=fSal.oninput=fUl.onchange=fDip.onchange=()=>{ cfg.tw=+fTw.value||0; cfg.sal=fSal.value; cfg.ul=fUl.value; cfg.dip2x=fDip.checked; save(); upd(); };
  set.append(el('label',{},'台股目標比重（%）',fTw), el('label',{},'本月可投入金額（元）',fSal), el('label',{},'美股二倍槓桿要買',fUl)); c2.append(set);
  c2.append(el('label',{style:'display:flex;align-items:flex-start;gap:0;font-size:.84rem;color:var(--muted);margin:6px 0 2px;cursor:pointer'}, fDip, el('span',{},'台股選項：融資過熱期間，收盤在季線下方時，薪資仍買二倍槓桿 00685L（回測和預設規則幾乎打平）')));
  const out=el('div',{}); c2.append(out);
  grid.append(c1,c2); main.append(grid);

  function upd(){
    const S={tl:0,t1:0,tb:0,core:0,ul:0,ub:0,up:0,to:0,uo:0}; const byRole={};

    if(!T && !(Sal>0)){ out.append(el('p',{class:'muted'},'在左邊輸入持股，或填本月可投入金額，這裡會依規則算出要買賣多少。還沒有持股的人，只要填金額就會告訴你第一次怎麼買。')); return; }
    const tgt=(cfg.tw||70)/100;
    const ulBuy = cfg.ul==='mix' ? [['00670L',.5],['00830',.5]] : [[cfg.ul,1]];
    const one=(k,a)=>`${k} ${b_(N(a))} 元（約 ${b_(N(shares(a,k)))} 股）`;
    const sellFrom=(role,amt)=>{ const list=(byRole[role]||[]).filter(x=>x.val>0).sort((a,b)=>b.val-a.val); const res=[]; let left=amt;
      for(const x of list){ const y=Math.min(left,x.val); if(y<=0) break; res.push(one(x.c,y)); left-=y; } return res.join('、'); };
    const oTW={nm:{lev:'00685L',one:'0050',bul:'00713'}, buy:(k,a)=>one({lev:'00685L',one:'0050',bul:'00713'}[k],a), sell:(k,a)=>sellFrom({lev:'tl',one:'t1',bul:'tb'}[k],a)};
    const oUS={nm:{lev:ulBuy.map(x=>x[0]).join('／'),one:'00662',bul:'00865B'}, buy:(k,a)=>k==='lev'?ulBuy.map(([c,f])=>one(c,a*f)).join('、'):one({one:'00662',bul:'00865B'}[k],a), sell:(k,a)=>sellFrom({lev:'ul',one:'up',bul:'ub'}[k],a)};
    // 本月投入：台美比重偏離超過 5% 時，全部投入比重低的一邊
    let sTW=Sal*tgt, sUS=Sal*(1-tgt); const tw_=T?TWv/T:tgt;
    if(T && tw_>tgt+0.05){ sTW=0; sUS=Sal; } else if(T && tw_<tgt-0.05){ sTW=Sal; sUS=0; }
    if(T){
      out.append(el('div',{class:'eyebrow',style:'margin-top:6px'},`總市值 ${N(T)} 元`));
      out.append(el('div',{class:'pf-bar'}, el('span',{class:'muted'},'台股／美股'), (()=>{ const b=el('div',{class:'bar'}); b.append(el('i',{class:'lev',style:`width:${TWv/T*100}%`}), el('i',{class:'bul',style:`width:${USv/T*100}%`})); return b; })(), el('span',{class:'num'},`${pct(TWv/T)} / ${pct(USv/T)}`)));
      out.append(el('p',{class:'note',style:'margin:-2px 0 6px'},`目標 ${pct(tgt)} / ${pct(1-tgt)}。台美比重只用新投入的錢慢慢調整，不為了比重賣股票。`));
    }
    const sleeve=(lab,m,v,sal,o)=>{ const t_=v.L2+v.L1+v.B; if(!m) return;
      if(!t_ && !(sal>0)) return;
      const h=el('h3',{style:'margin:16px 0 6px;font-size:.98rem'},lab); out.append(h);
      if(t_) out.append(el('div',{class:'pf-bar'}, el('span',{class:'muted'},'二倍／一倍／子彈'), bar3(v.L2/t_,v.L1/t_,v.B/t_), el('span',{class:'num'},mixTxt(v.L2/t_,v.L1/t_,v.B/t_))));
      out.append(el('p',{class:'note',style:'margin:-2px 0 6px'},`燈號：${t('st_'+m.state)}・建議組合 ${mixTxt(...sugMix(m))}`));
      drawActs(out, plan(m, v, sal, o).map(a=>({...a,h:a.h})));
    };
    oTW.dip2x=!!cfg.dip2x; sleeve('台股', DATA.tw, {L2:S.tl,L1:S.t1,B:S.tb}, sTW, oTW);
    if(S.core){ const v40=DATA.tw && DATA.tw.rule.vix>=40; out.append(el('p',{class:'note'}, v40?`核心持股 ${N(S.core)} 元：VIX ≥ 40，可以換成 00685L（${sellFrom('core',S.core).replace(/<[^>]+>/g,'')}）`:`核心持股 ${N(S.core)} 元不算在規則裡，等 VIX ≥ 40 再換成二倍槓桿`)); }
    sleeve('美股', DATA.us, {L2:S.ul,L1:S.up,B:S.ub}, sUS, oUS);
    if(S.to||S.uo) out.append(el('p',{class:'note'},`「其他」${N(S.to+S.uo)} 元不算進規則。`));
    if(T && tw_>tgt+0.05 && Sal>0) out.append(el('p',{class:'note'},`台股目前 ${pct(tw_)}，比目標高超過 5%，本月全部投入美股。`));
    if(T && tw_<tgt-0.05 && Sal>0) out.append(el('p',{class:'note'},`台股目前 ${pct(tw_)}，比目標低超過 5%，本月全部投入台股。`));
    out.append(el('p',{class:'note'},'股數依最近收盤價估算，下單前請用當時價格確認。'));
  }
  drawRows(); upd();
}

  else { const b0=vis[0][2]; acc=r=>r[2]/b0; const lo=d3.min(vis,acc), hi=d3.max(vis,acc); y=d3.scaleLog([lo/1.08,hi*1.08],[H-22,10]); yt=logT(lo/1.08,hi*1.08,5); yf=d3.format(',.2~f'); }
  axes(svg,x,y,H,ml,W-10,yf,yt);
  if(kind==='lev'){ svg.append('line').attr('x1',ml).attr('x2',W-10).attr('y1',y(1.2)).attr('y2',y(1.2)).attr('stroke',C.faint).attr('stroke-dasharray','4 3'); svg.append('text').attr('x',W-12).attr('y',y(1.2)-4).attr('text-anchor','end').attr('fill',C.muted).attr('font-size',10).text(L('基準 1.2 倍','Base 1.2x')); }
  svg.append('path').datum(vis).attr('fill','none').attr('stroke',C.brass).attr('stroke-width',1.8).attr('d',(kind==='lev'?d3.line().curve(d3.curveStepAfter):d3.line()).x(r=>x(P(r[0]))).y(r=>y(acc(r))));
  if(kind==='val'){ const l=vis[vis.length-1]; svg.append('text').attr('x',W-12).attr('y',y(acc(l))-6).attr('text-anchor','end').attr('fill',C.brass).attr('font-size',11).attr('font-weight',600).text(fmt(acc(l),1)+L(' 倍','x')); }
  const tip=btTip(box); const dot=svg.append('circle').attr('r',3.5).attr('fill',C.brass).attr('opacity',0); const bis=d3.bisector(r=>P(r[0])).center;
  svg.append('rect').attr('x',ml).attr('y',0).attr('width',W-10-ml).attr('height',H-22).attr('fill','transparent')
    .on('pointermove pointerdown',e=>{ const [mx]=d3.pointer(e); const r=vis[bis(vis,x.invert(mx))]; if(!r) return; dot.attr('cx',x(P(r[0]))).attr('cy',y(acc(r))).attr('opacity',1);
      tipAt(box,tip,[r[0], kind==='lev'?L(`槓桿 ${r[3].toFixed(2)} 倍`,`Leverage ${r[3].toFixed(2)}x`):L(`${fmt(acc(r),2)} 倍`,`${fmt(acc(r),2)}x`)], x(P(r[0]))*box.clientWidth/W, y(acc(r))*box.clientWidth/W); })
    .on('pointerleave',()=>{tip.hidden=true; dot.attr('opacity',0);});
}

/* ===================== 每日走勢圖 ===================== */
function baseOpt(){ return {backgroundColor:'transparent',animation:false,textStyle:{fontFamily:FONT,color:C.muted},
  grid:{left:8,right:12,top:18,bottom:26,containLabel:true},
  tooltip:{trigger:'axis',backgroundColor:'#0f1115',borderColor:C.line2,textStyle:{color:C.fg,fontSize:12,fontFamily:FONT},confine:true,axisPointer:{lineStyle:{color:C.line2}}},
  xAxis:{type:'category',boundaryGap:false,axisLine:{lineStyle:{color:C.line2}},axisTick:{show:false},axisLabel:{color:C.faint,fontSize:10,hideOverlap:true,formatter:v=>v.slice(2,7).replace('-','/')}},
  yAxis:{type:'value',scale:true,splitLine:{lineStyle:{color:C.line,type:[3,4]}},axisLabel:{color:C.faint,fontSize:10}} }; }
function drawCharts(m, idxD, idx){
  if(!window.echarts) return;
  const H=m.hist;
  const mk = (id,opt)=>{ const n=document.getElementById(id); if(!n) return; const c=echarts.init(n,null,{renderer:'canvas'}); c.setOption(opt); charts.push(c); };
  const SYM={panic1:'triangle',panic2:'triangle',deep:'emptyTriangle',rsi:'triangle',mg:'diamond',re:'circle'};
  const near=d=>{ let i=H.date.indexOf(d); if(i<0) i=H.date.findIndex(x=>x>d); return i; };
  const marks = m.marks.map(x=>{ const i=near(x.date); if(i<0) return null; return {coord:[H.date[i], H.close[i]], symbol:SYM[x.kind]||'circle', symbolRotate:x.kind==='rsi'?180:0, itemStyle:{color:KIND_C(x.kind)}, label:{show:false}, tooltip:{formatter:`${D8(x.date)}<br>${evName(x.kind)}`}}; }).filter(Boolean);
  const o1 = baseOpt(); o1.xAxis.data=H.date;
  o1.legend={top:0,right:0,textStyle:{color:C.muted,fontSize:11,fontFamily:FONT},icon:'roundRect',itemWidth:12,itemHeight:3};
  o1.grid.top=30; o1.tooltip.valueFormatter=v=>v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:idxD});
  o1.dataZoom=[{type:'inside',start:40,end:100}];
  const line=(name,data,color,w,dash)=>({name,type:'line',data,showSymbol:false,lineStyle:{color,width:w,type:dash||'solid'},itemStyle:{color}});
  const p = line(idx,H.close,C.fg,1.6); p.areaStyle={color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(235,231,223,.10)'},{offset:1,color:'rgba(235,231,223,0)'}])};
  p.markPoint={symbolSize:11,data:marks,tooltip:{trigger:'item'}};
  o1.series=[p, line(t('ln_ma60'),H.ma60,'#4fb6ff',1.4), line(t('ln_ma120'),H.ma120,'#ff8a3d',1.4), line(t('ln_ma240'),H.ma240,C.faint,1,'dashed')];
  mk('c-price',o1);
  const o2 = baseOpt(); o2.xAxis.data=H.date; o2.dataZoom=[{type:'inside',start:40,end:100}];
  o2.series=[{name:'VIX',type:'line',data:H.vix,showSymbol:false,lineStyle:{color:C.fg,width:1.3},itemStyle:{color:C.fg},
    markArea:{silent:true,data:[[{yAxis:35,itemStyle:{color:'rgba(230,98,90,.10)'}},{yAxis:40}],[{yAxis:40,itemStyle:{color:'rgba(230,98,90,.22)'}},{yAxis:90}]]},
    markLine:{silent:true,symbol:'none',label:{color:C.faint,fontSize:10,formatter:'{c}'},lineStyle:{type:[4,4],width:1},data:[{yAxis:35,lineStyle:{color:C.bad}},{yAxis:40,lineStyle:{color:C.bad}}]}}];
  o2.yAxis.max=v=>Math.max(45,Math.ceil(v.max/5)*5); o2.yAxis.min=8; mk('c-vix',o2);
  const R=m.hist_rsi; const o3=baseOpt(); o3.xAxis.data=R.date; o3.yAxis.min=10; o3.yAxis.max=95; o3.yAxis.scale=false;
  o3.series=[{name:t('ch_rsi'),type:'line',data:R.rsi,showSymbol:false,lineStyle:{color:C.brass,width:1.4},itemStyle:{color:C.brass},
    markLine:{silent:true,symbol:'none',label:{color:C.faint,fontSize:10},lineStyle:{type:[4,4],width:1},data:[{yAxis:m.rsi_refill,lineStyle:{color:C.info}}]}}];
  mk('c-rsi',o3);
}

function staleCheck(){
  const st=document.getElementById('stale'); const age=(Date.now()-new Date(DATA.generated).getTime())/864e5;
  // 只有會影響燈號的來源失敗才警示：VIX、指數價格、（台股）信用利差
  const crit = k => /^(CBOE|FRED) VIX$/.test(k) || /QQQ/.test(k) || /BAA/.test(k) || /2 年期/.test(k) || (MODE!=='us' && /加權/.test(k));
  const isBad=v=>v!=='ok' && !String(v).startsWith('快取'); const bad=Object.entries(DATA.sources||{}).some(([k,v])=>isBad(v) && crit(k));
  if (age>3.5 || bad){ st.hidden=false; st.textContent= bad ? t('stale_src',{s:Object.entries(DATA.sources).filter(([k,v])=>isBad(v)&&crit(k)).map(([k])=>k).join('、')}) : t('stale',{n:Math.floor(age)}); } else st.hidden=true;
}
function sourcesRender(){
  const s=document.getElementById('sources'); s.textContent='';
  const en = s => LANG!=='en' ? s : s.replace('CNN 恐懼貪婪','CNN Fear & Greed').replace('前瞻本益比','forward P/E').replace('加權指數','TAIEX').replace('美股融資','US margin debt').replace('2 年期殖利率','2-year yield').replace('利差','spread').replace('長期','history').replace('失敗','failed').replace('用快取到','using cache to').replace('快取: ','cached: ');
  for(const [k,v] of Object.entries(DATA.sources||{})){ const ok=v==='ok'||String(v).startsWith('快取'); s.append(el('span',{class:ok?'':'bad',title:v},en(k)+(v==='ok'?'':' ('+en(v)+')'))); }
}

(async ()=>{
  if (!TRIGGER || !window.claude || !window.claude.use) return;
  if (MODE==='us') return;
  const mcp = await window.claude.use('mcp'); if(!mcp) return;
  const b=document.getElementById('refresh'), msg=document.getElementById('refreshMsg'); b.hidden=false; b.textContent=t('refresh');
  b.onclick = async ()=>{
    b.disabled=true; b.textContent=t('refreshing'); msg.hidden=false; msg.textContent=t('m_sent');
    try{ await mcp.callTool('Claude Code Remote','fire_trigger',{trigger_id:TRIGGER}); }
    catch(e){
      b.disabled=false; b.textContent=t('refresh');
      const c=e&&e.code;
      msg.textContent = (c==='server_not_connected'||c==='needs_reauth') ? t('m_conn')
        : (c==='approval_required'||c==='not_in_manifest'||c==='consent_required') ? t('m_appr')
        : (c==='server_unavailable'||c==='upstream_error') ? t('m_busy') : t('m_fail',{c:c||'?'});
    }
  };
})();
})();
