name: 每日更新歐洲股價

on:
  schedule:
    - cron: "10 17 * * 1-5"   # 歐洲收盤後（UTC 17:10）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  eu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install financedatabase
      - name: 抓歐洲股價
        run: python scripts/build_eu.py docs/us/eu.json
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/us/eu.json
          git diff --cached --quiet || git commit -m "eu prices: $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
