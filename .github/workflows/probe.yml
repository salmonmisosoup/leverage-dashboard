name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          Y='https://query1.finance.yahoo.com/v8/finance/chart/SAP.DE?range=5d&interval=1d'
          YE=$(python3 -c "import urllib.parse;print(urllib.parse.quote('$Y',safe=''))")
          for u in "$Y" "https://query2.finance.yahoo.com/v8/finance/chart/SAP.DE?range=5d&interval=1d" \
            "https://api.allorigins.win/raw?url=$YE" "https://api.allorigins.win/get?url=$YE" \
            "https://corsproxy.io/?url=$YE" "https://api.codetabs.com/v1/proxy?quest=$Y" \
            "https://corsproxy.org/?$YE" "https://cors.eu.org/$Y" "https://thingproxy.freeboard.io/fetch/$Y" \
            "https://everyorigin.jwvbremen.nl/api/get?url=$YE" "https://whateverorigin.org/get?url=$YE" \
            "https://api.cors.lol/?url=$YE" "https://cors.x2u.in/$Y" "https://proxy.corsfix.com/?$Y" \
            "https://stooq.com/q/l/?s=sap.de&f=sd2t2ohlcv&h&e=json" "https://stooq.com/q/l/?s=sap.de&f=sd2t2ohlcv&h&e=csv" ; do
            echo "=== $u"
            curl -s -m 20 -D /tmp/h -o /tmp/b -H 'Origin: https://salmonmisosoup.github.io' -A 'Mozilla/5.0' "$u"; 
            head -1 /tmp/h; grep -i '^access-control-allow-origin' /tmp/h; head -c 250 /tmp/b; echo
          done
