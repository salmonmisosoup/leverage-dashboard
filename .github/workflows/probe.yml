name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          pip install -q financedatabase
          python - <<'PY'
          import financedatabase as fd, time, json, urllib.request
          e=fd.Equities().select(); f=fd.ETFs().select()
          print(e.columns.tolist()); print(f.columns.tolist())
          print(e['exchange'].value_counts().head(60).to_string())
          print(f['exchange'].value_counts().head(40).to_string())
          for s in ['SAP.DE','SAN.MC','SAN.PA','VWCE.DE','IB01.L','LQQ.PA']:
              print(s, s in e.index, s in f.index, (e.loc[s,'name'] if s in e.index else f.loc[s,'name'] if s in f.index else None))
          def get(u):
              r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}); return urllib.request.urlopen(r,timeout=30).read().decode()
          syms=[x for x in e.index if str(x).endswith('.DE')][:100]
          for u in ["https://query1.finance.yahoo.com/v7/finance/spark?symbols="+",".join(syms[:20])+"&range=5d&interval=1d",
                    "https://query1.finance.yahoo.com/v8/finance/spark?symbols="+",".join(syms[:100])+"&range=5d&interval=1d",
                    "https://query2.finance.yahoo.com/v7/finance/quote?symbols=SAP.DE,ASML.AS"]:
              try: t=get(u); print("OK",u[:70],len(t),t[:300])
              except Exception as x: print("ERR",u[:70],x)
          t0=time.time(); ok=0
          for s in syms[:40]:
              try: get(f"https://query1.finance.yahoo.com/v8/finance/chart/{s}?range=5d&interval=1d"); ok+=1
              except Exception as x: pass
          print("chart 40 seq",ok,round(time.time()-t0,1),"s")
          PY
