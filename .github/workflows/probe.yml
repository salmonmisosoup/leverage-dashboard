name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir out; pip install -q pandas openpyxl
          python - <<'PY'
          import os, json, urllib.request, re, pandas as pd
          T=os.environ.get("FINMIND_TOKEN","")
          def get(u, h=None):
              r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36", **(h or {})}); return urllib.request.urlopen(r,timeout=120).read()
          for ds in ["TaiwanTotalExchangeMarginMaintenance","TaiwanStockTotalMarginPurchaseShortSale"]:
              try:
                  j=json.loads(get(f"https://api.finmindtrade.com/api/v4/data?dataset={ds}&start_date=1990-01-01",{"Authorization":"Bearer "+T}))
                  d=pd.DataFrame(j.get("data",[])); d.to_csv(f"out/{ds}.csv",index=False); print(ds,len(d),d.head(2).to_dict("records"),d.tail(2).to_dict("records"), j.get("msg"))
              except Exception as e: print(ds,"ERR",e)
          try:
              html=get("https://www.finra.org/rules-guidance/key-topics/margin-accounts/margin-statistics").decode("utf-8","ignore")
              links=sorted(set(re.findall(r'href="([^"]+\.xlsx?)"',html))); print("finra links",links[:10])
              for l in links[:3]:
                  u=l if l.startswith("http") else "https://www.finra.org"+l
                  try: open("out/"+u.split("/")[-1],"wb").write(get(u)); print("saved",u)
                  except Exception as e: print("ERR",u,e)
          except Exception as e: print("finra ERR",e)
          PY
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: margin
          path: out
